<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星艦檔案：未知的終局 | 搜查終端</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #050b14;
      color: #e2e8f0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, rgba(5, 11, 20, 1) 100%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .cyber-card {
      background: rgba(10, 20, 38, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .cyber-border-glow::after {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: inherit;
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
      pointer-events: none;
    }
    .scanlines {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 50;
      opacity: 0.6;
    }
    .suspect-card { transition: all 0.2s ease-in-out; cursor: pointer; }
    .suspect-card.selected {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050b14; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden p-4 sm:p-6">
  <div class="scanlines"></div>

  <!-- 右上角音效按鈕 -->
  <div class="fixed top-4 right-4 z-50">
    <button onclick="toggleAudio()" id="audioBtn" class="bg-slate-900/90 hover:bg-slate-800 text-cyan-400 border border-cyan-700/50 p-2.5 rounded-full shadow-lg">
      <i class="fa-solid fa-volume-high" id="audioIcon"></i>
    </button>
  </div>

  <!-- 主要內容容器 -->
  <main class="container mx-auto max-w-5xl relative z-30">

    <!-- ================= 1. 金鑰輸入解鎖彈窗 (無範例提示字) ================= -->
    <div id="keyAuthModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl flex items-center justify-center z-50 p-4">
      <div class="cyber-card cyber-border-glow p-8 rounded-xl max-w-md w-full text-center space-y-6 relative">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-950 border border-cyan-500 text-cyan-400 text-2xl mb-2">
          <i class="fa-solid fa-shield-halved animate-bounce"></i>
        </div>
        <div>
          <h2 class="font-orbitron text-2xl font-bold text-cyan-300 tracking-wide">SECURITY GATEWAY</h2>
          <p class="text-xs text-slate-400 mt-1">請輸入您的專屬解鎖金鑰</p>
        </div>

        <div class="space-y-4">
          <input type="text" id="accessKeyInput" placeholder="請輸入金鑰" 
            class="w-full bg-slate-900/90 border border-cyan-500/50 rounded-lg px-4 py-3 text-center text-cyan-200 font-mono tracking-widest uppercase focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition">
          
          <button onclick="verifyAccessKey()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-6 rounded-lg font-orbitron tracking-wider shadow-lg shadow-cyan-500/20 transition">
            驗證並解鎖 <i class="fa-solid fa-key ml-2"></i>
          </button>
        </div>

        <div id="authStatusMsg" class="text-xs hidden p-2.5 rounded border font-mono"></div>
      </div>
    </div>


    <!-- ================= 2. 7大站點調查表單 (STATION 1 ~ 7) ================= -->
    <div id="stationFormView" class="hidden space-y-8">
      
      <!-- 艙區標題與介紹 -->
      <div class="cyber-card p-6 rounded-xl border-l-4 border-l-cyan-400 relative">
        <div class="flex justify-between items-start">
          <div>
            <div class="flex items-center space-x-2">
              <span id="stationBadge" class="bg-cyan-950 text-cyan-400 border border-cyan-800 text-xs px-2.5 py-0.5 rounded font-mono">STATION-01</span>
              <span class="text-xs text-slate-400 font-mono">SYSTEM UNLOCKED</span>
            </div>
            <h1 id="stationTitle" class="text-2xl sm:text-3xl font-bold text-cyan-100 mt-2 font-orbitron">站點 1：調查報告表單</h1>
          </div>
          <div class="text-right font-mono text-xs text-slate-400">
            <div>使用金鑰: <span id="activeKeyDisplay" class="text-cyan-400 font-bold">---</span></div>
          </div>
        </div>
        <p id="stationIntro" class="mt-4 text-sm text-slate-300 leading-relaxed border-t border-slate-800/80 pt-3">
          【表單介紹】這裡先隨便放點字，之後可以自己修改介紹內容。請隊員完成底下推理問答並送出。
        </p>
      </div>

      <!-- 表單本體 -->
      <form id="investigationForm" onsubmit="submitForm(event)" class="space-y-8">
        
        <!-- Q1: 兇手是誰 (29個選項複選) -->
        <div class="cyber-card p-6 rounded-xl space-y-4">
          <div class="flex justify-between items-center border-b border-cyan-900/40 pb-3">
            <h2 class="text-lg font-bold text-cyan-300 flex items-center">
              <span class="bg-cyan-900/60 text-cyan-300 text-xs w-6 h-6 rounded-full flex items-center justify-center mr-2 font-mono">Q1</span>
              兇手是誰？(可複選)
            </h2>
            <span class="text-xs text-cyan-400 font-mono">已選擇: <span id="selectedCount" class="font-bold text-cyan-300">0</span> / 29</span>
          </div>

          <div id="suspectsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 pt-2">
            <!-- 由 JS 動態繪製 29 個卡片 -->
          </div>
        </div>

        <!-- Q2: 作案動機 -->
        <div class="cyber-card p-6 rounded-xl space-y-3">
          <h2 class="text-lg font-bold text-cyan-300 flex items-center">
            <span class="bg-cyan-900/60 text-cyan-300 text-xs w-6 h-6 rounded-full flex items-center justify-center mr-2 font-mono">Q2</span>
            作案動機
          </h2>
          <textarea id="qMotive" rows="3" required placeholder="請填寫作案動機..." 
            class="w-full bg-slate-900/80 border border-cyan-900/60 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition"></textarea>
        </div>

        <!-- Q3: 系統異常的原因 -->
        <div class="cyber-card p-6 rounded-xl space-y-3">
          <h2 class="text-lg font-bold text-cyan-300 flex items-center">
            <span class="bg-cyan-900/60 text-cyan-300 text-xs w-6 h-6 rounded-full flex items-center justify-center mr-2 font-mono">Q3</span>
            系統異常的原因
          </h2>
          <textarea id="qAnomaly" rows="3" required placeholder="請填寫系統異常的原因..." 
            class="w-full bg-slate-900/80 border border-cyan-900/60 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition"></textarea>
        </div>

        <!-- Q4: 請輸入你蒐集到的所有核銷代碼 -->
        <div class="cyber-card p-6 rounded-xl space-y-3">
          <h2 class="text-lg font-bold text-cyan-300 flex items-center">
            <span class="bg-cyan-900/60 text-cyan-300 text-xs w-6 h-6 rounded-full flex items-center justify-center mr-2 font-mono">Q4</span>
            請輸入你蒐集到的所有核銷代碼
          </h2>
          <input type="text" id="qRedemptionCodes" required placeholder="請輸入核銷代碼..." 
            class="w-full bg-slate-900/80 border border-cyan-900/60 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-400 transition font-mono">
        </div>

        <!-- 送出按鈕 -->
        <div class="text-center pt-4">
          <button type="submit" id="submitBtn" class="bg-gradient-to-r from-cyan-500 to-emerald-600 hover:from-cyan-400 hover:to-emerald-500 text-slate-950 font-bold text-lg py-4 px-12 rounded-xl shadow-lg shadow-cyan-500/20 tracking-wider font-orbitron transition duration-200 transform hover:scale-105">
            傳輸報告 <i class="fa-solid fa-paper-plane ml-2"></i>
          </button>
        </div>
      </form>
    </div>


    <!-- ================= 3. 站點 8 統整主控台 (STATION 8 / ADMIN) ================= -->
    <div id="adminDashboardView" class="hidden space-y-8">
      <div class="cyber-card p-6 rounded-xl border-l-4 border-l-amber-500 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <div class="flex items-center space-x-2">
            <span class="bg-amber-950 text-amber-400 border border-amber-800 text-xs px-2.5 py-0.5 rounded font-mono">STATION-08</span>
            <span class="text-xs text-slate-400 font-mono">CENTRAL COMMAND</span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-bold text-amber-200 mt-1 font-orbitron">全船推理結果統整主控台</h1>
        </div>

        <div class="flex items-center space-x-4">
          <div class="bg-slate-900/90 border border-cyan-800 px-4 py-2 rounded-lg text-center">
            <div class="text-[10px] text-slate-400 font-mono">已繳交總份數</div>
            <div id="totalSubmissionsCount" class="text-2xl font-bold text-cyan-300 font-orbitron">0</div>
          </div>
          <button onclick="resetAllGameData()" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-700/50 text-xs px-3 py-2.5 rounded font-mono">
            <i class="fa-solid fa-rotate-right mr-1"></i> 重置所有紀錄
          </button>
        </div>
      </div>

      <!-- 圖表與金鑰作廢狀態 -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="cyber-card p-5 rounded-xl lg:col-span-2 space-y-4">
          <h3 class="font-bold text-cyan-300 text-sm font-orbitron flex items-center">
            <i class="fa-solid fa-chart-column mr-2 text-cyan-400"></i> 29 位嫌疑人指控得票統計
          </h3>
          <div class="h-64">
            <canvas id="suspectsChart"></canvas>
          </div>
        </div>

        <div class="cyber-card p-5 rounded-xl space-y-4">
          <h3 class="font-bold text-cyan-300 text-sm font-orbitron flex items-center">
            <i class="fa-solid fa-key mr-2 text-cyan-400"></i> 29 組金鑰核銷狀態 (已用 / 29)
          </h3>
          <div id="usedKeysGrid" class="grid grid-cols-5 gap-1.5 text-center text-xs font-mono max-h-60 overflow-y-auto">
            <!-- 顯示 29 個金鑰方塊 -->
          </div>
        </div>
      </div>

      <!-- 詳細回答列表 -->
      <div class="space-y-4">
        <h2 class="text-xl font-bold text-cyan-200 font-orbitron flex items-center">
          <i class="fa-solid fa-inbox mr-2 text-cyan-400"></i> 所有隊員回覆紀錄
        </h2>
        <div id="reportsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 動態渲染各隊伍提交的回答 -->
        </div>
      </div>
    </div>

  </main>

  <script>
    // 生成 29 組合法金鑰 KEY-01 ~ KEY-29
    const VALID_KEYS = Array.from({ length: 29 }, (_, i) => `KEY-${String(i + 1).padStart(2, '0')}`);

    // 生成 29 位嫌疑人資料
    const SUSPECTS = Array.from({ length: 29 }, (_, i) => ({
      id: `S${String(i + 1).padStart(2, '0')}`,
      name: `嫌疑人 ${String(i + 1).padStart(2, '0')} 號`
    }));

    let currentStation = 1;
    let currentKey = "";
    let selectedSuspects = new Set();
    let chartInstance = null;
    let audioMuted = false;

    // 跨分頁/跨視窗即時同步頻道
    const syncChannel = new BroadcastChannel('spaceship_sync_channel');

    function getUsedKeys() {
      return JSON.parse(localStorage.getItem('sf_used_keys') || '{}');
    }

    function getResponses() {
      return JSON.parse(localStorage.getItem('sf_responses') || '[]');
    }

    // 頁面初始化
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const st = parseInt(urlParams.get('station'));
      if (st >= 1 && st <= 8) currentStation = st;
      
      renderSuspectsGrid();

      if (currentStation === 8) {
        document.getElementById('keyAuthModal').classList.add('hidden');
        document.getElementById('stationFormView').classList.add('hidden');
        document.getElementById('adminDashboardView').classList.remove('hidden');
        renderAdminDashboard();
      } else {
        document.getElementById('stationTitle').innerText = `站點 ${currentStation} 調查報告表單`;
        document.getElementById('stationBadge').innerText = `STATION-0${currentStation}`;
      }
    });

    // 監聽其他分頁傳來的更新訊息
    syncChannel.onmessage = () => {
      if (currentStation === 8) renderAdminDashboard();
    };

    // 渲染 29 位嫌疑人卡片
    function renderSuspectsGrid() {
      const grid = document.getElementById('suspectsGrid');
      grid.innerHTML = '';

      SUSPECTS.forEach(s => {
        const card = document.createElement('div');
        card.className = `suspect-card cyber-card p-2.5 rounded-lg text-center border border-slate-800 select-none`;
        card.id = `suspect-card-${s.id}`;
        card.onclick = () => toggleSuspect(s.id);

        card.innerHTML = `
          <div class="w-9 h-9 mx-auto rounded-full bg-slate-900 border border-cyan-800 flex items-center justify-center text-cyan-400 text-xs font-mono font-bold mb-1">
            ${s.id}
          </div>
          <div class="text-xs font-bold text-slate-200">${s.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSuspect(id) {
      playBeep(800, 0.03);
      const card = document.getElementById(`suspect-card-${id}`);
      if (selectedSuspects.has(id)) {
        selectedSuspects.delete(id);
        card.classList.remove('selected');
      } else {
        selectedSuspects.add(id);
        card.classList.add('selected');
      }
      document.getElementById('selectedCount').innerText = selectedSuspects.size;
    }

    // 金鑰驗證邏輯
    function verifyAccessKey() {
      let inputVal = document.getElementById('accessKeyInput').value.trim().toUpperCase();

      // 支持簡寫輸入 (例如輸入 "1" 自動補全為 "KEY-01")
      if (/^\d+$/.test(inputVal)) {
        inputVal = `KEY-${String(parseInt(inputVal)).padStart(2, '0')}`;
      }

      const usedKeys = getUsedKeys();

      if (!inputVal) {
        showAuthMsg("請輸入金鑰代碼", "error");
        return;
      }

      if (!VALID_KEYS.includes(inputVal)) {
        showAuthMsg("【無效金鑰】無此金鑰權限，請重新確認。", "error");
        playAlarm();
        return;
      }

      if (usedKeys[inputVal]) {
        showAuthMsg(`【ACCESS DENIED】金鑰 (${inputVal}) 已被使用過！`, "error");
        playAlarm();
        return;
      }

      // 驗證成功 -> 解鎖頁面
      currentKey = inputVal;
      document.getElementById('activeKeyDisplay').innerText = currentKey;
      document.getElementById('keyAuthModal').classList.add('hidden');
      document.getElementById('stationFormView').classList.remove('hidden');
      playSuccess();
    }

    function showAuthMsg(msg, type) {
      const msgBox = document.getElementById('authStatusMsg');
      msgBox.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border-red-600');
      msgBox.classList.add('bg-red-950/80', 'text-red-300', 'border-red-600/50');
      msgBox.innerText = msg;
    }

    // 表單提交處理
    function submitForm(e) {
      e.preventDefault();

      if (selectedSuspects.size === 0) {
        alert("請至少選擇一位您推測的兇手！");
        return;
      }

      const responseData = {
        station: currentStation,
        key: currentKey,
        suspects: Array.from(selectedSuspects),
        motive: document.getElementById('qMotive').value,
        anomaly: document.getElementById('qAnomaly').value,
        codes: document.getElementById('qRedemptionCodes').value,
        timestamp: new Date().toLocaleString()
      };

      // 寫入儲存區
      const usedKeys = getUsedKeys();
      const responses = getResponses();

      usedKeys[currentKey] = { usedAt: new Date().toLocaleString(), station: currentStation };
      responses.push(responseData);

      localStorage.setItem('sf_used_keys', JSON.stringify(usedKeys));
      localStorage.setItem('sf_responses', JSON.stringify(responses));

      // 廣播更新給其他開啟的視窗/主控台
      syncChannel.postMessage('update');

      playSuccess();
      alert(`【傳輸成功】報告已送出！金鑰 [${currentKey}] 已完成核銷。`);

      // 重置表單為中空
      resetFormToBlank();
    }

    // 填完後恢復預設中空畫面並回到輸入金鑰彈窗
    function resetFormToBlank() {
      // 清空選擇的兇手
      selectedSuspects.clear();
      document.querySelectorAll('.suspect-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('selectedCount').innerText = '0';

      // 清空文字框
      document.getElementById('qMotive').value = '';
      document.getElementById('qAnomaly').value = '';
      document.getElementById('qRedemptionCodes').value = '';
      document.getElementById('accessKeyInput').value = '';

      // 隱藏表單、跳回金鑰輸入視窗
      document.getElementById('stationFormView').classList.add('hidden');
      document.getElementById('keyAuthModal').classList.remove('hidden');
      document.getElementById('authStatusMsg').classList.add('hidden');
    }

    // 站點 8 (主控台) 渲染
    function renderAdminDashboard() {
      const usedKeys = getUsedKeys();
      const responses = getResponses();

      // 1. 更新繳交總數
      document.getElementById('totalSubmissionsCount').innerText = responses.length;

      // 2. 渲染 29 組金鑰核銷狀態圖格
      const keysGrid = document.getElementById('usedKeysGrid');
      keysGrid.innerHTML = '';
      VALID_KEYS.forEach(k => {
        const isUsed = !!usedKeys[k];
        const box = document.createElement('div');
        box.className = `p-1.5 rounded border text-[10px] font-mono ${isUsed ? 'bg-red-950/60 border-red-700 text-red-300' : 'bg-emerald-950/40 border-emerald-800 text-emerald-400'}`;
        box.innerText = k;
        box.title = isUsed ? `已使用 (站點 ${usedKeys[k].station})` : '尚未核銷';
        keysGrid.appendChild(box);
      });

      // 3. 渲染回答明細
      const reportsList = document.getElementById('reportsList');
      reportsList.innerHTML = '';

      if (responses.length === 0) {
        reportsList.innerHTML = `<div class="col-span-full text-center text-slate-500 py-8">尚無任何隊員提交報告</div>`;
      } else {
        responses.slice().reverse().forEach((resp, index) => {
          const card = document.createElement('div');
          card.className = "cyber-card p-5 rounded-xl space-y-3 border-t-2 border-t-cyan-400";
          
          const suspectBadges = resp.suspects.map(id => `<span class="bg-cyan-950 text-cyan-300 border border-cyan-800 text-xs px-2 py-0.5 rounded font-mono">${id}</span>`).join(' ');

          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <span class="font-bold text-cyan-300 font-orbitron">金鑰: ${resp.key} (站點 ${resp.station})</span>
              <span class="text-[10px] text-slate-500 font-mono">${resp.timestamp}</span>
            </div>
            <div><span class="text-xs text-slate-400">指控兇手：</span><div class="flex flex-wrap gap-1 mt-1">${suspectBadges}</div></div>
            <div><span class="text-xs text-slate-400">作案動機：</span><p class="text-xs text-slate-200 mt-1 bg-slate-900/60 p-2 rounded border border-slate-800">${escapeHtml(resp.motive)}</p></div>
            <div><span class="text-xs text-slate-400">系統異常原因：</span><p class="text-xs text-slate-200 mt-1 bg-slate-900/60 p-2 rounded border border-slate-800">${escapeHtml(resp.anomaly)}</p></div>
            <div><span class="text-xs text-slate-400">核銷代碼：</span><div class="text-xs font-mono text-amber-300 mt-0.5">${escapeHtml(resp.codes)}</div></div>
          `;
          reportsList.appendChild(card);
        });
      }

      // 4. 繪製指控圖表
      renderChart(responses);
    }

    function renderChart(responses) {
      const ctx = document.getElementById('suspectsChart').getContext('2d');
      const tally = {};
      SUSPECTS.forEach(s => tally[s.id] = 0);

      responses.forEach(resp => {
        if (resp.suspects) {
          resp.suspects.forEach(id => { tally[id] = (tally[id] || 0) + 1; });
        }
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(tally),
          datasets: [{
            label: '得票數',
            data: Object.values(tally),
            backgroundColor: 'rgba(0, 240, 255, 0.5)',
            borderColor: '#00f0ff',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } },
            x: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function resetAllGameData() {
      if (confirm("確定要重置所有提交紀錄與回復所有金鑰嗎？")) {
        localStorage.removeItem('sf_used_keys');
        localStorage.removeItem('sf_responses');
        syncChannel.postMessage('update');
        renderAdminDashboard();
        alert("資料庫已全數重置！");
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 音效管理
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function toggleAudio() {
      audioMuted = !audioMuted;
      document.getElementById('audioIcon').className = audioMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
    }
    function playBeep(freq, dur) {
      if (audioMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = freq;
        g.gain.value = 0.05;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }
    function playSuccess() { playBeep(523, 0.08); setTimeout(()=>playBeep(783, 0.15), 80); }
    function playAlarm() { playBeep(180, 0.2); }
  </script>
</body>
</html>
